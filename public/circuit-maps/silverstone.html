\",\"3\":\"Village\",\"4\":\"The Loop\",\"5\":\"Aintree\",\"6\":\"Brooklands\",\"7\":\"Luffield\",\"8\":\"Woodcote\",\"9\":\"Copse\",\"10\":\"\",\"11\":\"Maggotts\",\"12\":\"\",\"13\":\"Becketts\",\"14\":\"Chapel\",\"15\":\"Stowe\",\"16\":\"\",\"17\":\"Club\",\"18\":\"\"},CPTS={\"1\":[542.98,377.18],\"2\":[509.2,278.14],\"3\":[416.54,213.28],\"4\":[460.13,163.66],\"5\":[372.75,162.09],\"6\":[256.1,480.65],\"7\":[342.08,514],\"8\":[208.21,512.69],\"9\":[91.15,275.74],\"10\":[286.71,156.89],\"11\":[339.47,114.88],\"12\":[409.56,107.35],\"13\":[461.04,63.26],\"14\":[535.77,104.17],\"15\":[905.32,181.6],\"16\":[805.66,373.58],\"17\":[833.14,404.92],\"18\":[776.84,457.07]};\nconst SECB=[300,735],LAP_MS=15000,START=0.5577;\nconst base=document.getElementById('base'),car=document.getElementById('car'),callout=document.getElementById('callout'),coNum=document.getElementById('coNum'),coName=document.getElementById('coName'),secBadge=document.getElementById('secBadge'),secRect=document.getElementById('secRect'),secTxt=document.getElementById('secTxt');\nconst SE=[document.getElementById('s0'),document.getElementById('s1'),document.getElementById('s2')];\nconst SECINFO=[{n:'SECTOR 1',c:'#2f6fd6'},{n:'SECTOR 2',c:'#e6322e'},{n:'SECTOR 3',c:'#1f9d55'}];\nconst total=base.getTotalLength(),NS=3000,samples=[];for(let i=0;i<=NS;i++){const p=base.getPointAtLength(i/NS*total);samples.push([p.x,p.y]);}\nfunction fracFor(px,py){let bi=0,bd=1e9;for(let i=0;i<samples.length;i++){const dx=samples[i][0]-px,dy=samples[i][1]-py,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;bi=i;}}return bi/NS;}\nlet corners=[];for(const k in CPTS)corners.push({k:+k,f:fracFor(CPTS[k][0],CPTS[k][1])});corners.forEach(c=>c.cf=(((c.f-START)%1)+1)%1);corners.sort((a,b)=>a.cf-b.cf);\nconst B1=SECB[0],B2=SECB[1];const segs=[{el:SE[0],a:0,b:B1},{el:SE[1],a:B1,b:B2},{el:SE[2],a:B2,b:1000}];\nfunction secOf(L){return L<B1?0:(L<B2?1:2);}\nconst SF=START*1000;function setSeg(el,a,cur){if(cur<=a){el.style.opacity=0;return;}el.style.opacity=1;const len=cur-a;const p0=(((SF+a)%1000)+1000)%1000;const end=p0+len;el.setAttribute('stroke-dashoffset','0');if(end<=1000){el.setAttribute('stroke-dasharray','0 '+p0.toFixed(2)+' '+len.toFixed(2)+' 2000');}else{const L1=1000-p0,L2=end-1000;el.setAttribute('stroke-dasharray',L2.toFixed(2)+' '+(p0-L2).toFixed(2)+' '+L1.toFixed(2)+' 2000');}}\nfunction paintTo(L){segs.forEach(s=>setSeg(s.el,s.a,Math.min(L,s.b)));}\nfunction clearCM(){document.querySelectorAll('.cm').forEach(e=>e.classList.remove('active'));}\nfunction renderAt(prog){prog=Math.max(0,Math.min(1,prog));car.style.opacity=1;{const _em=elevAt(prog);elevDot.style.opacity=1;elevDot.setAttribute('cx',ex(prog));elevDot.setAttribute('cy',ey(_em));elevRead.textContent='+'+Math.round(_em)+' m';}const gf=(START+prog)%1;const L=prog*1000;paintTo(L);const pt=base.getPointAtLength(gf*total);car.setAttribute('cx',pt.x);car.setAttribute('cy',pt.y);const si=secOf(L);secBadge.style.opacity=1;secRect.setAttribute('fill',SECINFO[si].c);secTxt.textContent=SECINFO[si].n;let cur=null;for(const c of corners){if(c.cf*1000<=L+6)cur=c;}clearCM();const atSF=(!cur)||L>=994;if(atSF){callout.style.opacity=1;coNum.textContent='S/F';coName.textContent='Start / Finish';}else if(cur){const g=document.querySelector('.cm[data-k=\"'+cur.k+'\"]');if(g)g.classList.add('active');callout.style.opacity=1;coNum.textContent='T'+cur.k;coName.textContent=NAMES[cur.k]||'';}else{callout.style.opacity=0;}}\nwindow.seek=renderAt;window.LAP_MS=LAP_MS;\n// ---------- elevation profile ----------\n// real profiles, digitised from the official track maps, aligned start→finish, shared metre scale\nconst SILV=[[0,0],[.04,3],[.08,6],[.12,9],[.15,11],[.18,12.5],[.21,13],[.24,11.5],[.27,12.5],[.30,11],[.33,12],[.36,11],[.40,9],[.43,7.5],[.46,7],[.49,8],[.52,10],[.55,12],[.58,13],[.61,13],[.64,11.5],[.67,12.5],[.70,12],[.72,13],[.75,12],[.78,11.5],[.81,12.5],[.84,11],[.87,8],[.89,9.5],[.91,7],[.93,5],[.95,6],[.97,3],[1,0]];\nconst RBR=[[0,0],[.05,1],[.10,3],[.14,8],[.16,12],[.18,10],[.20,12],[.23,20],[.26,40],[.28,58],[.30,68],[.33,64],[.37,55],[.41,48],[.45,42],[.49,37],[.53,33],[.56,35],[.58,38],[.61,34],[.64,30],[.67,27],[.70,24],[.73,26],[.76,22],[.79,24],[.82,26],[.85,22],[.88,15],[.91,9],[.94,5],[.97,2],[1,0]];\nconst EX0=92,EX1=948,EBASE=185,ETOP=20,EMAX=26,MS=(EBASE-ETOP)/EMAX;\nconst ex=p=>EX0+p*(EX1-EX0),ey=m=>EBASE-m*MS;\nfunction profAt(D,p){p=Math.max(0,Math.min(1,p));for(let i=0;i<D.length-1;i++){if(p<=D[i+1][0]){const t=(p-D[i][0])/(D[i+1][0]-D[i][0]);return D[i][1]+t*(D[i+1][1]-D[i][1]);}}return 0;}\nconst elevAt=p=>profAt(SILV,p);\nfunction smooth(pts){let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+','+c2x.toFixed(1)+' '+c2y.toFixed(1)+','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}return d;}\nconst lineD=D=>smooth(D.map(([p,m])=>[ex(p),ey(m)]));\nconst silvD=lineD(SILV),rbrD=lineD(RBR),floor=ey(0);\nconst SVGNS='http://www.w3.org/2000/svg';\nfunction el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}\nconst svg=document.getElementById('elev'),defs=svg.querySelector('defs');\nconst rg=el('linearGradient',{id:'rbrGrad',x1:0,y1:0,x2:0,y2:1});rg.appendChild(el('stop',{offset:0,'stop-color':'#e6322e','stop-opacity':0.5}));rg.appendChild(el('stop',{offset:1,'stop-color':'#e6322e','stop-opacity':0.05}));defs.appendChild(rg);\nconst elevFill=document.getElementById('elevFill'),elevLine=document.getElementById('elevLine');\n// Silverstone (reuse existing blue paths)\nelevFill.setAttribute('d',silvD+' L'+EX1+' '+floor+' L'+EX0+' '+floor+' Z');\nelevLine.setAttribute('d',silvD);elevLine.setAttribute('stroke','#5fa0ff');elevLine.setAttribute('stroke-width','3.5');\nconst gG=document.getElementById('elevGuides'),gL=document.getElementById('elevLabels');\ngG.appendChild(el('line',{x1:EX0,y1:floor,x2:EX1,y2:floor,stroke:'#33436a','stroke-width':1.5}));\n[[0,'0'],[5,'5'],[10,'10'],[13,'13']].forEach(([m,lab])=>{\n  gG.appendChild(el('line',{x1:EX0-7,y1:ey(m),x2:EX0,y2:ey(m),stroke:'#33436a','stroke-width':1.5}));\n  gL.appendChild(el('text',{x:EX0-12,y:ey(m)+6,'font-size':19,'text-anchor':'end',fill:'#8295b6','font-weight':700})).textContent=lab;\n});\ngL.appendChild(el('text',{x:EX0-12,y:ey(13)-18,'font-size':15,'text-anchor':'end',fill:'#8295b6','letter-spacing':1})).textContent='m';\n// dashed ceiling at peak\ngG.appendChild(el('line',{x1:EX0,y1:ey(13),x2:EX1,y2:ey(13),stroke:'#5fa0ff','stroke-width':1.2,'stroke-dasharray':'4 5','opacity':.5}));\n// legend\nconst slvL=el('text',{x:EX1,y:ey(13)-6,'font-size':19,'text-anchor':'end',fill:'#9cc4ff','font-weight':800,'letter-spacing':1});slvL.textContent='SILVERSTONE · 5.9 km · ▲13 m';gL.appendChild(slvL);\ngL.appendChild(el('text',{x:EX0,y:floor+24,'font-size':14,fill:'#6c7ea0','font-weight':700,'letter-spacing':1.5})).textContent='START';\ngL.appendChild(el('text',{x:(EX0+EX1)/2,y:floor+24,'font-size':13,'text-anchor':'middle',fill:'#566080','font-weight':600,'letter-spacing':1.5})).textContent='S/F = 0 m · elevation vs lap %';\ngL.appendChild(el('text',{x:EX1,y:floor+24,'font-size':14,'text-anchor':'end',fill:'#6c7ea0','font-weight':700,'letter-spacing':1.5})).textContent='FINISH';\nconst elevDot=document.getElementById('elevDot'),elevRead=document.getElementById('elevRead');\n// ---------- end elevation ----------\n\nfunction reset(){clearInterval(window._iv);paintTo(0);car.style.opacity=0;callout.style.opacity=0;secBadge.style.opacity=0;clearCM();elevDot.style.opacity=0;elevRead.textContent='+0 m';}\nfunction play(){reset();const t0=performance.now();window._iv=setInterval(()=>{let prog=(performance.now()-t0)/LAP_MS;renderAt(prog);if(prog>=1)clearInterval(window._iv);},16);}\ndocument.getElementById('play').onclick=play;document.getElementById('reset').onclick=reset;reset();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
