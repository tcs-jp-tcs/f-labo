<script>
const trace=document.getElementById('trace'),dot=document.getElementById('dot');
const turnEl=document.getElementById('turn'),secEl=document.getElementById('sector');
const LT=trace.getTotalLength();
trace.style.strokeDasharray=LT; trace.style.strokeDashoffset=LT;
const B1=0.3298,B2=0.666,DUR=18000;
// ターン比率（idxベース）
const turnR=[[1, 0.1498], [2, 0.1681], [3, 0.2311], [4, 0.3465], [5, 0.4249], [6, 0.4733], [7, 0.5176], [8, 0.541], [9, 0.5951], [10, 0.7251], [11, 0.7411], [12, 0.7897], [13, 0.8443], [14, 0.9014]];
const secName={1:'SECTOR 1',2:'SECTOR 2',3:'SECTOR 3'};
const secCol={1:'#c8d2e0',2:'#8b97b0',3:'#cfd8e6'};
let start=null;
function frame(t){
 if(!start)start=t;
 let e=((t-start)%DUR)/DUR;
 // 赤なぞり：全周を一定速度で描画
 trace.style.strokeDashoffset=LT*(1-e);
 let pt=trace.getPointAtLength(LT*e);
 dot.setAttribute('cx',pt.x); dot.setAttribute('cy',pt.y);
 let sec=e<B1?1:(e<B2?2:3);
 secEl.textContent=secName[sec]; secEl.style.color=secCol[sec];
 let tn=1;
 for(let i=0;i<turnR.length;i++){ if(e>=turnR[i][1]-0.005) tn=turnR[i][0]; }
 turnEl.textContent='TURN '+tn;
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
