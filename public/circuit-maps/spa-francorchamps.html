oke-linejoin','round');e.setAttribute('stroke-linecap','round');});\nconst total=base.getTotalLength(),NS=3000,samples=[];for(let i=0;i<=NS;i++){const p=base.getPointAtLength(i/NS*total);samples.push([p.x,p.y]);}\nfunction fracFor(px,py){let bi=0,bd=1e9;for(let i=0;i<samples.length;i++){const dx=samples[i][0]-px,dy=samples[i][1]-py,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;bi=i;}}return bi/NS;}\n// draw numbered corner markers from CPTS\nconst cornersG=document.getElementById('corners');\nfor(const k in CPTS){const[cx,cy]=CPTS[k];const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','cm');g.setAttribute('data-k',k);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',11);c.setAttribute('fill','#0a1430');c.setAttribute('stroke','#fff');c.setAttribute('stroke-width',1.6);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',cx);t.setAttribute('y',cy+4.5);t.setAttribute('font-size',13);t.setAttribute('font-weight',700);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#fff');t.textContent=k;g.appendChild(c);g.appendChild(t);cornersG.appendChild(g);}\nlet corners=[];function recomputeCorners(){corners=[];for(const k in CPTS)corners.push({k:+k,f:fracFor(CPTS[k][0],CPTS[k][1])});corners.forEach(c=>c.cf=(((c.f-START)%1)+1)%1);corners.sort((a,b)=>a.cf-b.cf);}recomputeCorners();\nconst straightsG=document.getElementById('straights');\nfunction renderStraights(){straightsG.innerHTML='';STRAIGHTS.forEach((s,i)=>{const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',s.x);t.setAttribute('y',s.y);t.setAttribute('font-size',13);t.setAttribute('font-weight',700);t.setAttribute('letter-spacing',2);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#9fb0c8');t.setAttribute('transform','rotate('+s.rot+' '+s.x+' '+s.y+')');t.setAttribute('data-si',i);t.setAttribute('class','st');t.textContent=s.name;straightsG.appendChild(t);});}\nrenderStraights();\nconst B1=SECB[0],B2=SECB[1];const segs=[{el:SE[0],a:0,b:B1},{el:SE[1],a:B1,b:B2},{el:SE[2],a:B2,b:1000}];\nfunction secOf(L){return L<B1?0:(L<B2?1:2);}\nconst SF=START*1000;function setSeg(el,a,cur){if(cur<=a){el.style.opacity=0;return;}el.style.opacity=1;const len=cur-a;const p0=(((SF+a)%1000)+1000)%1000;const end=p0+len;el.setAttribute('stroke-dashoffset','0');if(end<=1000){el.setAttribute('stroke-dasharray','0 '+p0.toFixed(2)+' '+len.toFixed(2)+' 2000');}else{const L1=1000-p0,L2=end-1000;el.setAttribute('stroke-dasharray',L2.toFixed(2)+' '+(p0-L2).toFixed(2)+' '+L1.toFixed(2)+' 2000');}}\nfunction paintTo(L){segs.forEach(s=>setSeg(s.el,s.a,Math.min(L,s.b)));}\nfunction clearCM(){document.querySelectorAll('.cm').forEach(e=>e.classList.remove('active'));}\nfunction renderAt(prog){prog=Math.max(0,Math.min(1,prog));car.style.opacity=1;{const _em=elevAt(prog);elevDot.style.opacity=1;elevDot.setAttribute('cx',ex(prog));elevDot.setAttribute('cy',ey(_em));elevRead.textContent=(prog*7).toFixed(1)+' km · '+Math.round(_em)+' m';}const gf=(START+prog)%1;const L=prog*1000;paintTo(L);const pt=base.getPointAtLength(gf*total);car.setAttribute('cx',pt.x);car.setAttribute('cy',pt.y);const si=secOf(L);secBadge.style.opacity=1;secRect.setAttribute('fill',SECINFO[si].c);secTxt.textContent=SECINFO[si].n;let cur=null;for(const c of corners){if(c.cf*1000<=L+6)cur=c;}clearCM();const atSF=(!cur)||L>=994;if(atSF){callout.style.opacity=1;coNum.textContent='S/F';coName.textContent='Start / Finish';}else if(cur){const g=document.querySelector('.cm[data-k=\"'+cur.k+'\"]');if(g)g.classList.add('active');callout.style.opacity=1;coNum.textContent='T'+cur.k;coName.textContent=NAMES[cur.k]||'';}else{callout.style.opacity=0;}}\nwindow.seek=renderAt;window.LAP_MS=LAP_MS;\n// ---------- elevation profile ----------\nconst SPA=[[0,51],[0.04,49],[0.08,42],[0.12,32],[0.15,30],[0.19,36],[0.23,49],[0.27,66],[0.31,84],[0.34,96],[0.37,103],[0.40,93],[0.44,76],[0.48,62],[0.52,51],[0.57,41],[0.61,32],[0.65,26],[0.69,25],[0.72,21],[0.75,12],[0.79,20],[0.83,30],[0.87,38],[0.91,44],[0.95,49],[1,53]];\nconst MINM=0,MAXM=112,EX0=92,EX1=948,EBASE=210,ETOP=24;\nconst MS=(EBASE-ETOP)/(MAXM-MINM);\nconst ex=p=>EX0+p*(EX1-EX0),ey=m=>EBASE-(m-MINM)*MS;\nfunction profAt(D,p){p=Math.max(0,Math.min(1,p));for(let i=0;i<D.length-1;i++){if(p<=D[i+1][0]){const t=(p-D[i][0])/(D[i+1][0]-D[i][0]);return D[i][1]+t*(D[i+1][1]-D[i][1]);}}return 0;}\nconst elevAt=p=>profAt(SPA,p);\nfunction smooth(pts){let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+','+c2x.toFixed(1)+' '+c2y.toFixed(1)+','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}return d;}\nconst lineD=D=>smooth(D.map(([p,m])=>[ex(p),ey(m)]));\nconst spaLineD=lineD(SPA),floor=ey(MINM);\nconst SVGNS='http://www.w3.org/2000/svg';\nfunction el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}\nconst elevFill=document.getElementById('elevFill'),elevLine=document.getElementById('elevLine');\nelevFill.setAttribute('d',spaLineD+' L'+EX1+' '+floor+' L'+EX0+' '+floor+' Z');\nelevLine.setAttribute('d',spaLineD);\nconst gG=document.getElementById('elevGuides'),gL=document.getElementById('elevLabels');\ngG.appendChild(el('line',{x1:EX0,y1:floor,x2:EX1,y2:floor,stroke:'#33436a','stroke-width':1.5}));\n[[0,'0'],[20,'20'],[40,'40'],[60,'60'],[80,'80'],[100,'100']].forEach(([m,lab])=>{\n  gG.appendChild(el('line',{x1:EX0-7,y1:ey(m),x2:EX0,y2:ey(m),stroke:'#33436a','stroke-width':1.5}));\n  gL.appendChild(el('text',{x:EX0-12,y:ey(m)+6,'font-size':19,'text-anchor':'end',fill:'#8295b6','font-weight':700})).textContent=lab;\n});\ngL.appendChild(el('text',{x:EX0-12,y:ey(MAXM)-14,'font-size':15,'text-anchor':'end',fill:'#8295b6','letter-spacing':1})).textContent='m';\n// S/F reference line (start height)\ngG.appendChild(el('line',{x1:EX0,y1:ey(51),x2:EX1,y2:ey(51),stroke:'#7d8db0','stroke-width':1.6,'stroke-dasharray':'2 4','opacity':.6}));\ngL.appendChild(el('text',{x:EX1,y:ey(51)-7,'font-size':14,'text-anchor':'end',fill:'#7d8db0','font-weight':700})).textContent='S/F';\n// dashed ceiling at peak\ngG.appendChild(el('line',{x1:EX0,y1:ey(103),x2:EX1,y2:ey(103),stroke:'#5fa0ff','stroke-width':1.2,'stroke-dasharray':'4 5','opacity':.5}));\n// legend\nconst lg=el('text',{x:EX1,y:ey(103)-6,'font-size':19,'text-anchor':'end',fill:'#9cc4ff','font-weight':800,'letter-spacing':1});lg.textContent='SPA-FRANCORCHAMPS · 7.0 km · ▲103 m';gL.appendChild(lg);\ngL.appendChild(el('text',{x:EX0,y:floor+24,'font-size':14,fill:'#6c7ea0','font-weight':700,'letter-spacing':1.5})).textContent='START';\ngL.appendChild(el('text',{x:(EX0+EX1)/2,y:floor+24,'font-size':13,'text-anchor':'middle',fill:'#566080','font-weight':600,'letter-spacing':1.5})).textContent='elevation vs lap %';\ngL.appendChild(el('text',{x:EX1,y:floor+24,'font-size':14,'text-anchor':'end',fill:'#6c7ea0','font-weight':700,'letter-spacing':1.5})).textContent='FINISH';\nconst elevDot=document.getElementById('elevDot'),elevRead=document.getElementById('elevRead');\n// ---------- end elevation ----------\nfunction reset(){clearInterval(window._iv);renderAt(0);}\nfunction play(){reset();const t0=performance.now();window._iv=setInterval(()=>{let prog=(performance.now()-t0)/LAP_MS;renderAt(prog);if(prog>=1)clearInterval(window._iv);},16);}\ndocument.getElementById('play').onclick=play;document.getElementById('reset').onclick=reset;reset();\n// ---------- editor ----------\nconst mapSvg=document.getElementById('map');\nfunction save(){localStorage.setItem(LS_KEY,JSON.stringify({CPTS,NAMES,straights:STRAIGHTS}));}\nfunction toSVG(evt){const pt=mapSvg.createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;return pt.matrixTransform(mapSvg.getScreenCTM().inverse());}\nfunction addCorner(k,cx,cy){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','cm');g.setAttribute('data-k',k);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',11);c.setAttribute('fill','#0a1430');c.setAttribute('stroke','#fff');c.setAttribute('stroke-width',1.6);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',cx);t.setAttribute('y',cy+4.5);t.setAttribute('font-size',13);t.setAttribute('font-weight',700);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#fff');t.textContent=k;g.appendChild(c);g.appendChild(t);cornersG.appendChild(g);}\nlet EDIT=false,drag=null;\ndocument.getElementById('edit').onclick=()=>{EDIT=!EDIT;mapSvg.classList.toggle('editing',EDIT);document.getElementById('editbar').style.display=EDIT?'flex':'none';document.getElementById('edit').textContent=EDIT?'\\u2713 DONE':'\\u270e EDIT';if(!EDIT){recomputeCorners();save();}};\nmapSvg.addEventListener('pointerdown',e=>{if(!EDIT)return;const cm=e.target.closest('.cm'),st=e.target.closest('.st');if(cm)drag={type:'c',k:cm.getAttribute('data-k')};else if(st)drag={type:'s',i:+st.getAttribute('data-si')};if(drag){e.preventDefault();mapSvg.setPointerCapture(e.pointerId);}});\nmapSvg.addEventListener('pointermove',e=>{if(!drag)return;const p=toSVG(e),x=Math.round(p.x*10)/10,y=Math.round(p.y*10)/10;if(drag.type==='c'){CPTS[drag.k]=[x,y];const g=cornersG.querySelector('.cm[data-k=\"'+drag.k+'\"]');g.querySelector('circle').setAttribute('cx',x);g.querySelector('circle').setAttribute('cy',y);const t=g.querySelector('text');t.setAttribute('x',x);t.setAttribute('y',y+4.5);}else{STRAIGHTS[drag.i].x=x;STRAIGHTS[drag.i].y=y;renderStraights();}});\nmapSvg.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});\nmapSvg.addEventListener('dblclick',e=>{if(!EDIT)return;const cm=e.target.closest('.cm'),st=e.target.closest('.st');if(cm){const k=cm.getAttribute('data-k'),n=prompt('T'+k+' name (blank = number only):',NAMES[k]||'');if(n!==null){NAMES[k]=n;save();}}else if(st){const i=+st.getAttribute('data-si'),n=prompt('Straight name:',STRAIGHTS[i].name);if(n!==null){STRAIGHTS[i].name=n;renderStraights();save();}}});\nmapSvg.addEventListener('contextmenu',e=>{if(!EDIT)return;const cm=e.target.closest('.cm'),st=e.target.closest('.st');if(cm){e.preventDefault();const k=cm.getAttribute('data-k');const a=prompt('Options for T'+k+':\\n- type a NUMBER to renumber\\n- type \"del\" to delete','');if(a===null)return;if(a.toLowerCase()==='del'){delete CPTS[k];delete NAMES[k];cm.remove();}else if(a.trim()!==''){const nk=a.trim();CPTS[nk]=CPTS[k];NAMES[nk]=NAMES[k];delete CPTS[k];delete NAMES[k];cm.setAttribute('data-k',nk);cm.querySelector('text').textContent=nk;}save();}else if(st){e.preventDefault();const i=+st.getAttribute('data-si');const a=prompt('Rotation degrees (or \"del\" to delete):',STRAIGHTS[i].rot);if(a===null)return;if(a.toLowerCase()==='del'){STRAIGHTS.splice(i,1);}else{STRAIGHTS[i].rot=parseFloat(a)||0;}renderStraights();save();}});\ndocument.getElementById('addC').onclick=()=>{let mx=0;for(const k in CPTS)mx=Math.max(mx,+k);const nk=mx+1;CPTS[nk]=[480,300];NAMES[nk]='';addCorner(nk,480,300);save();};\ndocument.getElementById('addS').onclick=()=>{STRAIGHTS.push({name:'STRAIGHT',x:480,y:300,rot:0});renderStraights();save();};\ndocument.getElementById('expBtn').onclick=()=>{const j=JSON.stringify({CPTS,NAMES,straights:STRAIGHTS});navigator.clipboard&&navigator.clipboard.writeText(j);const ta=document.createElement('textarea');ta.value=j;ta.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:80vw;height:40vh;z-index:99;background:#0a1430;color:#9fb0c8;border:1px solid #2c3e63;padding:12px;font:12px monospace';ta.onblur=()=>ta.remove();document.body.appendChild(ta);ta.focus();ta.select();};\ndocument.getElementById('clrBtn').onclick=()=>{if(confirm('Discard your edits and reload defaults?')){localStorage.removeItem(LS_KEY);location.reload();}};\n\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
