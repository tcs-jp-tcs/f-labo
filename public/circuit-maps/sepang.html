<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>Sepang International Circuit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0B1428;overflow:hidden}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
     font-variant-numeric:tabular-nums}
#fit{position:absolute;top:0;left:0;transform-origin:top left}
#stage{position:relative;width:1080px;height:1920px;background:#0B1428}
.abs{position:absolute}
#sectorBadge{padding:16px 34px;border-radius:10px;font-weight:800;letter-spacing:.14em;color:#fff;
  background:#2C7BE5;display:inline-block;white-space:nowrap}
#cornerBox .big{font-weight:800;color:#fff;line-height:1;white-space:nowrap}
#cornerBox .sm{font-weight:700;color:#9DB2D0;margin-top:8px;letter-spacing:.06em;white-space:nowrap}
svg{width:100%;overflow:visible}
.cnum{fill:#0B1428;stroke:#8FA6C8;stroke-width:3}
.clead{opacity:.5}
.cnumT{fill:#E6EEF9;pointer-events:none;font-size:30px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.axl{fill:#6C82A8;font-size:24px;font-weight:700}
.grid{stroke:#22314F;stroke-width:1.5}
#edPanel{position:absolute;right:16px;top:16px;width:320px;background:rgba(8,16,32,.96);
  border:1px solid #2E4670;border-radius:12px;padding:14px;z-index:50;font-size:13px;color:#C7D6EC;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#edHead{font-size:15px;font-weight:800;letter-spacing:.08em;color:#9DB2D0;margin-bottom:10px}
.edRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.edRow span{width:120px;flex:none;color:#7A90AE}
.edRow input{flex:1;accent-color:#E8323C}
.edHint{color:#6C82A8;line-height:1.6;margin:6px 0 10px}
#edBtns{display:flex;gap:8px;margin-bottom:8px}
#edBtns button{flex:1;background:#22355A;color:#DCE7F7;border:1px solid #2E4670;
  border-radius:7px;padding:6px;font-size:12px;font-weight:700;cursor:pointer}
#edJson{width:100%;height:90px;background:#070E1C;color:#8FE3A8;border:1px solid #22314F;
  border-radius:7px;padding:6px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
.cmark{cursor:grab}
.txt{font-weight:800;letter-spacing:.14em;color:#4A5E80;white-space:nowrap}

</style></head>

      <textarea id="edJson" readonly></textarea>
    </div>
  </div>
</div></div>

/* ---- elevation ---- */
var EW=960,EH=300,PL=76,PR=14,PT=14,PB=44,iw=EW-PL-PR,ih=EH-PT-PB;
function ex(f){return PL+f*iw} function ey(m){return PT+ih-(m/EMAX)*ih}
var g="";
for(var v=0;v<=GMAX;v+=(GMAX>30?10:5)){
  g+='<line class="grid" x1="'+PL+'" y1="'+ey(v).toFixed(1)+'" x2="'+(EW-PR)+'" y2="'+ey(v).toFixed(1)+'"/>'
   +'<text class="axl" x="'+(PL-12)+'" y="'+(ey(v)+8).toFixed(1)+'" text-anchor="end">'+v+'m</text>';
}
function drawElev(){
var eline="",N=200;
for(var i=0;i<=N;i++){var f=i/N; eline+=(i?"L":"M")+ex(f).toFixed(1)+" "+ey(elevRaw(f)).toFixed(1);}
document.getElementById("elev").innerHTML=
 '<defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">'+
 '<stop offset="0%" stop-color="#2C7BE5" stop-opacity=".5"/>'+
 '<stop offset="100%" stop-color="#2C7BE5" stop-opacity=".04"/></linearGradient>'+
 '<clipPath id="ec"><rect id="ecr" x="'+PL+'" y="0" width="0" height="'+EH+'"/></clipPath></defs>'+g+
 '<path id="earea" d="'+eline+'L'+ex(1).toFixed(1)+' '+ey(0).toFixed(1)+'L'+ex(0).toFixed(1)+' '+ey(0).toFixed(1)+'Z" fill="url(#eg)" clip-path="url(#ec)"/>'+
 '<path d="'+eline+'" fill="none" stroke="#22314F" stroke-width="4" stroke-linejoin="round"/>'+
 '<path d="'+eline+'" fill="none" stroke="#4DA3FF" stroke-width="4" stroke-linejoin="round" clip-path="url(#ec)"/>'+
 '<text class="axl" x="'+PL+'" y="'+(EH-12)+'">START</text>'+
 '<text class="axl" x="'+(EW-PR)+'" y="'+(EH-12)+'" text-anchor="end">FINISH</text>'+
 '<circle id="edot" r="10" fill="#FFFFFF" stroke="#0B1428" stroke-width="3"/>';
edot=document.getElementById("edot"); ecr=document.getElementById("ecr");
}
var edot,ecr; drawElev();
document.getElementById("elevVal").textContent=D.lap_km.toFixed(3)+" km  \u00B7  \u25B2"+(D.elev_max-D.elev_min).toFixed(1)+" m";

var car=document.getElementById("car");
var badge=document.getElementById("sectorBadge");
var hdBig=document.getElementById("lblBig"),hdSm=document.getElementById("lblSm");
var SECCOL=["#2C7BE5","#E8323C","#28A745"];

window.seek=function(p){
  p=p<0?0:p>1?1:p;
  document.getElementById("p1").setAttribute("d", seg(0, Math.min(p,S1_END), 200));
  document.getElementById("p2").setAttribute("d", p>S1_END ? seg(S1_END, Math.min(p,S2_END), 200) : "");
  document.getElementById("p3").setAttribute("d", p>S2_END ? seg(S2_END, p, 200) : "");
  ecr.setAttribute("width", (p*iw).toFixed(1));

  var xy=xyAt(p);
  car.setAttribute("cx",xy[0].toFixed(1)); car.setAttribute("cy",xy[1].toFixed(1));
  edot.setAttribute("cx",ex(p).toFixed(1)); edot.setAttribute("cy",ey(elevRaw(p)).toFixed(1));

  var s=p<S1_END?0:p<S2_END?1:2;
  badge.textContent="SECTOR "+(s+1); badge.style.background=SECCOL[s];

  var nearSF=(p<0.030)||(p>0.970), shown=lastCorner(p);
  if(nearSF||shown<0){ hdBig.textContent="S/F"; hdSm.textContent="Start / Finish"; }
  else { hdBig.textContent="T"+("0"+(shown+1)).slice(-2); hdSm.textContent=CORNERS[shown].name||""; }

  var a=atCorner(p);
  for(var i=0;i<CORNERS.length;i++){
    markers[i].setAttribute("stroke", i===a?"#FFFFFF":"#8FA6C8");
    markers[i].setAttribute("stroke-width", i===a?6:3);
    markers[i].setAttribute("fill", i===a?"#1E3A63":"#0B1428");
  }
};

var fit=document.getElementById("fit"), scale=1;
function fitToWindow(){
  scale=Math.min(window.innerWidth/1080,window.innerHeight/1920,1);
  fit.style.transform="translateX("+Math.max(0,(window.innerWidth-1080*scale)/2)+"px) scale("+scale+")";
}
if(!window.__CAPTURE__){fitToWindow();window.addEventListener("resize",fitToWindow);}
window.seek(0);

/* ---- 配置エディタ（Eキーで開閉） ---- */
(function(){
  var panel=document.getElementById("edPanel");
  var svg=document.getElementById("map");
  var dragging=null, hoverI=-1;
  var MARK={size:30, off:52, lead:50};
  function dump(){
    var o={size:MARK.size, off:MARK.off, lead:MARK.lead, start:+START.toFixed(4), s1:+S1_END.toFixed(4), s2:+S2_END.toFixed(4), cornerF:CORNERS.map(function(c){return +c.f.toFixed(4)}), pos:{}};
    CORNERS.forEach(function(c,i){ o.pos[i]=[c.mx,c.my]; });
    document.getElementById("edJson").value=JSON.stringify(o);
  }
  function toLocal(ev){
    var pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function restyle(){
    document.querySelectorAll(".cnum").forEach(function(e){ e.setAttribute("r", MARK.size); });
    document.querySelectorAll(".cnumT").forEach(function(e){ e.setAttribute("font-size", MARK.size*1.25); });
    document.querySelectorAll(".chit").forEach(function(e){ e.setAttribute("r", MARK.size*1.4); });
    document.querySelectorAll(".clead").forEach(function(e){ e.setAttribute("opacity", MARK.lead/100); });
  }
  document.addEventListener("keydown",function(e){
    if(e.key==="e"||e.key==="E"){
      var open = panel.style.display==="none";
      panel.style.display = open ? "block" : "none"; dump();
      if(open){ playing=false; window.seek(0.9999); }
      else { playing=true; t0=null; requestAnimationFrame(loop); }
    }
    if((e.key==="r"||e.key==="R") && hoverI>=0){
      var c=CORNERS[hoverI], p=defaultPos({f:c.f, off:MARK.off, side:c.side});
      c.mx=Math.round(p[0]); c.my=Math.round(p[1]); drawMap(); restyle(); dump();
    }
  });
  box.addEventListener("mousedown",function(ev){
    var g=ev.target.closest(".cmark"); if(!g) return;
    var i=+g.dataset.ci, l=toLocal(ev);
    dragging={i:i, ox:l.x-CORNERS[i].mx, oy:l.y-CORNERS[i].my};
    ev.preventDefault();
  });
  box.addEventListener("mouseover",function(ev){
    var g=ev.target.closest(".cmark"); hoverI = g? +g.dataset.ci : -1;
  });
  window.addEventListener("mousemove",function(ev){
    if(!dragging) return;
    var l=toLocal(ev);
    CORNERS[dragging.i].mx=Math.round(l.x-dragging.ox);
    CORNERS[dragging.i].my=Math.round(l.y-dragging.oy);
    drawMap(); restyle(); dump();
  });
  window.addEventListener("mouseup",function(){ dragging=null; });
  document.getElementById("edSize").addEventListener("input",function(){
    MARK.size=+this.value; document.getElementById("edSizeV").textContent=this.value; restyle(); dump(); });
  document.getElementById("edOff").addEventListener("input",function(){
    MARK.off=+this.value; document.getElementById("edOffV").textContent=this.value; dump(); });
  document.getElementById("edLead").addEventListener("input",function(){
    MARK.lead=+this.value; document.getElementById("edLeadV").textContent=this.value; restyle(); dump(); });
  document.getElementById("edCopy").addEventListener("click",function(){
    var t=document.getElementById("edJson"); t.select();
    navigator.clipboard.writeText(t.value);
    this.textContent="コピーしました"; var b=this;
    setTimeout(function(){b.textContent="JSONをコピー"},1200);
  });
  document.getElementById("edLoad").addEventListener("click",function(){
    var v=prompt("JSONを貼り付け"); if(!v) return;
    try{ var o=JSON.parse(v);
      if(o.size){MARK.size=o.size; document.getElementById("edSize").value=o.size; document.getElementById("edSizeV").textContent=o.size;}
      if(o.off){MARK.off=o.off; document.getElementById("edOff").value=o.off; document.getElementById("edOffV").textContent=o.off;}
      if(o.lead!==undefined){MARK.lead=o.lead; document.getElementById("edLead").value=o.lead; document.getElementById("edLeadV").textContent=o.lead;}
      if(o.pos){ CORNERS.forEach(function(c,i){ if(o.pos[i]){ c.mx=o.pos[i][0]; c.my=o.pos[i][1]; } }); }
      if(o.start!==undefined){ var dv=o.start-START0; sf.value=dv; document.getElementById("edSFV").textContent=dv.toFixed(4); applyStart(dv); }
      if(o.s1!==undefined){ S1_END=o.s1; RAW.s1=(S1_END+START)%1; e1.value=S1_END; document.getElementById("edS1V").textContent=S1_END.toFixed(3); }
      if(o.s2!==undefined){ S2_END=o.s2; RAW.s2=(S2_END+START)%1; e2.value=S2_END; document.getElementById("edS2V").textContent=S2_END.toFixed(3); }
      drawMap(); restyle(); dump();
    }catch(err){ alert("読み取れませんでした"); }
  });
  // --- S/F line & sector boundaries (kept fixed on the track when S/F moves) ---
  var RAW={s1:(S1_END+START)%1, s2:(S2_END+START)%1, c:CORNERS.map(function(c){return (c.f+START)%1})};
  function applyStart(v){
    START=((START0+v)%1+1)%1;
    S1_END=((RAW.s1-START)%1+1)%1; S2_END=((RAW.s2-START)%1+1)%1;
    CORNERS.forEach(function(c,i){ c.f=((RAW.c[i]-START)%1+1)%1; });
    e1.value=S1_END; e2.value=S2_END;
    document.getElementById("edS1V").textContent=S1_END.toFixed(3); document.getElementById("edS2V").textContent=S2_END.toFixed(3);
    drawMap(); restyle(); drawElev(); window.seek(0.9999); dump(); if(window.__drawSecH) window.__drawSecH();
  }
  var sf=document.getElementById("edSF"), e1=document.getElementById("edS1"), e2=document.getElementById("edS2");
  e1.value=S1_END; e2.value=S2_END;
  document.getElementById("edS1V").textContent=S1_END.toFixed(3); document.getElementById("edS2V").textContent=S2_END.toFixed(3);
  sf.addEventListener("input",function(){ document.getElementById("edSFV").textContent=(+this.value).toFixed(4); applyStart(+this.value); });
  e1.addEventListener("input",function(){ S1_END=+this.value; RAW.s1=(S1_END+START)%1; document.getElementById("edS1V").textContent=S1_END.toFixed(3); window.seek(0.999); dump(); });
  e2.addEventListener("input",function(){ S2_END=+this.value; RAW.s2=(S2_END+START)%1; document.getElementById("edS2V").textContent=S2_END.toFixed(3); window.seek(0.999); dump(); });
  var _load=document.getElementById("edLoad");
  _load.addEventListener("click",function(){ /* start/s1/s2 in pasted JSON are applied below if present */ });
  restyle(); dump();
})();


/* ---- sector boundary handles: drag along the track (editor open) ---- */
(function(){
  var svg=document.getElementById("map"), gH=document.getElementById("secH");
  var HN=[{k:"s1",col:"#E8323C",lab:"S1|S2"},{k:"s2",col:"#28A745",lab:"S2|S3"}];
  var drag=-1;
  function val(k){ return k==="s1"?S1_END:S2_END; }
  function draw(){
    gH.innerHTML="";
    var show=document.getElementById("edPanel").style.display!=="none";
    if(!show) return;
    HN.forEach(function(h,i){
      var p=xyAt(val(h.k));
      var g=el("g",{"data-h":i,style:"cursor:grab"});
      g.appendChild(el("circle",{cx:p[0],cy:p[1],r:26,fill:h.col,stroke:"#FFFFFF","stroke-width":5}));
      var t=el("text",{x:p[0],y:p[1]-40,fill:"#FFFFFF","font-size":26,"font-weight":800,"text-anchor":"middle"});
      t.textContent=h.lab; g.appendChild(t);
      gH.appendChild(g);
    });
  }
  window.__drawSecH=draw;
  function nearestF(x,y){
    var best=0,bd=1e18;
    for(var i=0;i<=2000;i++){ var f=i/2000, p=xyAt(f), d=(p[0]-x)*(p[0]-x)+(p[1]-y)*(p[1]-y); if(d<bd){bd=d;best=f;} }
    return best;
  }
  function toLocal(ev){ var pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
  gH.addEventListener("mousedown",function(ev){ var g=ev.target.closest("g[data-h]"); if(!g) return; drag=+g.dataset.h; ev.preventDefault(); ev.stopPropagation(); });
  window.addEventListener("mousemove",function(ev){
    if(drag<0) return;
    var l=toLocal(ev), f=nearestF(l.x,l.y);
    var e=document.getElementById(drag===0?"edS1":"edS2");
    e.value=f; e.dispatchEvent(new Event("input"));
    draw();
  });
  window.addEventListener("mouseup",function(){ drag=-1; });
  document.addEventListener("keydown",function(e){ if(e.key==="e"||e.key==="E") setTimeout(draw,0); });
})();

/* ---- playback ---- */
var playing=true, t0=null, rafP=0;
function loop(ts){ if(!playing){return;} if(t0===null)t0=ts; window.seek(((ts-t0)%LAP_MS)/LAP_MS); rafP=requestAnimationFrame(loop); }
if(!window.__CAPTURE__) rafP=requestAnimationFrame(loop);

</script></body></html>
